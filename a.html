<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TRON USDT Approve (imToken)</title>
<script src="./TronWeb.min.js"></script>
<script src="./qrcode.min.js"></script>
<style>
  body{font-family:sans-serif;padding:20px;max-width:600px;margin:auto}
  input{margin:5px 0;padding:8px;width:100%;box-sizing:border-box}
  button{margin:5px 0;padding:10px;width:100%;box-sizing:border-box;border:none;border-radius:4px;color:#fff;cursor:pointer}
  .blue{background:#1677ff} .orange{background:#ff4d4f} .gray{background:#888}
  #status{margin:10px 0;padding:10px;background:#e6f7ff;border-radius:4px}
  #dep{margin:10px 0;padding:10px;background:#fffbe6;border-radius:4px;font-size:13px;white-space:pre-wrap}
  #qr{margin:10px 0;text-align:center}
  pre{background:#f5f5f5;padding:10px;border-radius:4px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h3>TRON USDT Approve（imToken 扫码）</h3>
<div id="status">初始化…</div>
<div id="dep"></div>
<div id="qr"></div><hr>
USDT 合约：<input id="usdt" value="TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj"><br>
Spender：<input id="spender" value="TGdEJQ9FxioesYuqmWXSBj28qif8ervQ8r"><br>
额度(USDT)：<input id="amount" value="1"><br>
<button class="blue" id="approve">发起授权 approve</button>
<button class="orange" id="revoke">撤销授权（置 0）</button>
<button class="gray" id="disconnect">断开连接</button>
<pre id="log"></pre>

<script type="module">
import * as WC from 'https://esm.sh/@tronweb3/walletconnect-tron@4.0.3?bundle=all';

const st = m => status.innerText = m;
const log = m => document.getElementById('log').innerText = m;

// ✅ 修正：直接使用导出的 WalletConnectWallet
const WcClass = WC.WalletConnectWallet;

dep.innerText = 'TronWeb=' + (typeof TronWeb) + '\nQRCode=' + (typeof QRCode) + '\nWalletConnectWallet=' + (typeof WcClass) + '\nwc 导出 keys: ' + Object.keys(WC).join(', ');

let wallet = null;
const tw = new TronWeb({ fullHost: 'https://api.trongrid.io' });

function draw(u) {
  qr.innerHTML = '';
  new QRCode(qr, { text: u, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.H });
}

async function start() {
  try {
    if (typeof WcClass !== 'function') throw new Error('WalletConnectWallet 导出失败，请检查网络');
    
    // ⚠️ 注意：这里必须替换成你真实的 Reown projectId
    wallet = new WcClass({
      network: 'Mainnet',
      options: {
        relayUrl: 'wss://relay.walletconnect.com',
        projectId: '79fdcd030fe9e6e174073d69f9c9d04a', 
        metadata: { name: 'TRON Approve Demo', description: 'demo', url: location.href, icons: [] }
      }
    });
    
    st('正在生成二维码…');
    const res = await wallet.connect({
      onUri: u => { draw(u); st('请用 imToken 扫码'); }
    });
    
    st('已连接: ' + (res.address || wallet.address));
    log('地址: ' + (res.address || wallet.address));
    qr.innerHTML = '';
  } catch (e) {
    st('连接错误: ' + (e.message || e));
    log('错误详情: ' + (e.stack || e));
  }
}
window.onload = start;

async function doApprove(v) {
  try {
    if (!wallet) throw new Error('请先扫码连接');
    const addr = wallet.address;
    const usdt = document.getElementById('usdt').value.trim();
    const sp = document.getElementById('spender').value.trim();
    
    if (isNaN(Number(v)) || Number(v) < 0) throw new Error('额度非法');
    
    const base = BigInt(Math.round(Number(v) * 1e6)).toString();
    st('正在构造 approve…');
    
    const { transaction } = await tw.transactionBuilder.triggerSmartContract(
      usdt, 'approve(address,uint256)',
      { feeLimit: 100000000, callValue: 0 },
      [{ type: 'address', value: sp }, { type: 'uint256', value: base }],
      addr
    );
    
    log('请求 imToken 签名:\napprove(' + sp + ', ' + base + ')');
    const signed = await wallet.signTransaction(transaction);
    const r = await tw.trx.sendRawTransaction(signed);
    
    st('已广播');
    log('TXID: ' + (r && r.txid ? r.txid : JSON.stringify(r)));
  } catch (e) {
    st('错误: ' + (e.message || e));
    log('错误详情: ' + (e.stack || e));
  }
}

document.getElementById('approve').onclick = () => doApprove(document.getElementById('amount').value.trim());
document.getElementById('revoke').onclick = () => doApprove('0');
document.getElementById('disconnect').onclick = async () => {
  try { if (wallet && wallet.disconnect) await wallet.disconnect(); } catch (e) {}
  st('已断开');
  qr.innerHTML = '';
};
</script>
</body>
</html>
