<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TRON USDT approve - WC 本地依赖版</title>
<style>
 body{font-family:Arial,sans-serif;max-width:640px;margin:20px auto;padding:0 16px;color:#222}
 h3{margin-bottom:6px}
 .tip{color:#666;font-size:13px}
 button{width:100%;padding:12px;margin:8px 0;font-size:15px;cursor:pointer}
 input{width:100%;padding:9px;margin:6px 0;box-sizing:border-box;font-size:14px}
 #qr{text-align:center;margin:16px 0;min-height:280px}
 #status{font-weight:bold;color:#135;margin:8px 0}
 #log{background:#f4f4f4;padding:10px;border-radius:6px;white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:260px;overflow:auto}
 .err{color:#c00}
</style>

<!-- 引用顺序不能乱：buffer -> sign-client -> TronWeb -> qrcode -> wc(适配器umd) -->
<script src="./buffer.min.js"></script>
<script>window.Buffer = window.Buffer || (window.buffer && window.buffer.Buffer);</script>
<script src="./sign-client.js"></script>
<script src="./TronWeb.min.js"></script>
<script src="./qrcode.min.js"></script>
<script src="./wc.js"></script>
</head>
<body>
<h3>TRON USDT approve（imToken 扫码授权）</h3>
<div class="tip">打开页面自动生成二维码 → imToken 扫码连接 → 点按钮发起 approve</div>
<div id="status">加载依赖中…</div>
<div id="qr"></div>
<hr>

<label>USDT 合约地址（TRC20）</label>
<input id="usdt" value="TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t">

<label>授权给（spender）</label>
<input id="spender" value="TGdEJQ9FxioesYuqmWXSBj28qif8ervQ8r">

<label>额度（USDT 个数，6位精度）</label>
<input id="amount" value="1">

<button id="approve">发起授权 approve</button>
<button id="revoke">撤销授权（置 0）</button>
<button id="disconnect">断开连接</button>

<pre id="log"></pre>

<script>
const st = m => document.getElementById('status').innerText = m;
const log = m => document.getElementById('log').innerText += m + '\n';

let wallet = null;
const tw = new TronWeb({ fullHost: 'https://api.trongrid.io' });

// 取适配器类（UMD 挂在 window['@tronweb3/tronwallet-adapters']）
function getAdapter(){
  const ns = window['@tronweb3/tronwallet-adapters'];
  if(ns && ns.WalletConnectAdapter) return ns.WalletConnectAdapter;
  if(window.WalletConnectAdapter) return window.WalletConnectAdapter;
  return null;
}

// 画二维码
function draw(uri){
  const box = document.getElementById('qr');
  box.innerHTML = '';
  if(window.QRCode && typeof window.QRCode === 'function'){
    new QRCode(box, { text: uri, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.H });
  } else if(window.QRCode && window.QRCode.toCanvas){
    QRCode.toCanvas(uri, { width: 260 }, (e, c) => {
      if(e){ st('二维码生成失败：' + e.message); return; }
      box.appendChild(c);
    });
  } else {
    st('qrcode.min.js 未加载');
  }
}

// 自检依赖
function selfCheck(){
  const miss = [];
  if(typeof window.Buffer === 'undefined') miss.push('buffer.min.js');
  if(typeof TronWeb === 'undefined') miss.push('TronWeb.min.js');
  if(!window.QRCode) miss.push('qrcode.min.js');
  if(!getAdapter()) miss.push('wc.js(sign-client/buffer)');
  if(miss.length){
    st('依赖缺失：' + miss.join('、'));
    log('请检查以下文件是否上传且大小正常：' + miss.join('、'));
    return false;
  }
  return true;
}

// 启动：连接 WC，自动出码
async function start(){
  if(!selfCheck()) return;
  try{
    const Adapter = getAdapter();
    wallet = new Adapter({
      network: 'Mainnet',
      options: {
        relayUrl: 'wss://relay.walletconnect.com',
        projectId: '79fdcd030fe9e6e174073d69f9c9d04a',   // ⚠️ 必须替换成你自己的
        metadata: { name: 'TRON approve demo', description: 'demo', url: location.href, icons: [] }
      }
    });

    st('生成二维码…');
    await wallet.connect({
      onUri: uri => { draw(uri); st('请用 imToken 扫一扫'); }
    });

    const addr = wallet.address || '';
    st('已连接：' + addr);
    log('钱包地址：' + addr);
    document.getElementById('qr').innerHTML = '';
  }catch(e){
    st('连接错误：' + (e && e.message ? e.message : e));
    log('错误详情：' + (e && e.stack ? e.stack : e));
  }
}
window.onload = start;

// 构造 + 签名 + 广播 approve
async function doApprove(v){
  try{
    if(!wallet) throw new Error('请先扫码连接');
    const addr = wallet.address || '';
    if(!addr) throw new Error('未拿到钱包地址');

    const usdt = document.getElementById('usdt').value.trim();
    const sp   = document.getElementById('spender').value.trim();
    if(!usdt || !sp) throw new Error('合约地址或 spender 为空');
    if(isNaN(Number(v)) || Number(v) < 0) throw new Error('额度非法');

    // USDT 为 6 位精度
    const base = BigInt(Math.round(Number(v) * 1e6)).toString();

    st('构造 approve 交易…');
    const { transaction } = await tw.transactionBuilder.triggerSmartContract(
      usdt,
      'approve(address,uint256)',
      { feeLimit: 100000000, callValue: 0 },
      [{ type: 'address', value: sp }, { type: 'uint256', value: base }],
      addr
    );

    log('请求 imToken 签名：approve(' + sp + ', ' + base + ')');
    const signed = await wallet.signTransaction(transaction);
    const r = await tw.trx.sendRawTransaction(signed);

    st('已广播');
    log('TXID：' + (r && r.txid ? r.txid : JSON.stringify(r)));
  }catch(e){
    st('错误：' + (e && e.message ? e.message : e));
    log('错误详情：' + (e && e.stack ? e.stack : e));
  }
}

document.getElementById('approve').onclick  = () => doApprove(document.getElementById('amount').value.trim());
document.getElementById('revoke').onclick   = () => doApprove('0');
document.getElementById('disconnect').onclick = async () => {
  try{ if(wallet && wallet.disconnect) await wallet.disconnect(); }catch(e){}
  st('已断开');
  document.getElementById('qr').innerHTML = '';
};
</script>
</body>
</html>
