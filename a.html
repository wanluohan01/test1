<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRON DApp 手机扫码交互</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #333; }
        .box {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            margin-top: 10px;
        }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .highlight { color: #007bff; word-break: break-all; font-weight: bold; }
    </style>
</head>
<body>

    <h2>TRON 智能合约交互 - 手机扫码体验</h2>
    <p>请使用手机上的 <span style="color: red; font-weight: bold;">TronLink App</span> 扫码打开此页面进行测试：</p>

    <!-- 二维码展示区块 -->
    <div class="box">
        <img id="qrcode" src="" alt="正在生成二维码..." style="width: 200px; height: 200px; border: 1px solid #eee; padding: 5px;">
        <p>当前页面链接：<br><span id="urlText" class="highlight"></span></p>
    </div>

    <!-- 交互操作区块（扫码后在手机上显示） -->
    <div class="box" style="text-align: left;">
        <h3>合约交互区</h3>
        <p>合约地址：<code style="word-break: break-all; font-size: 12px;">TPEbXV8AEFVoysQiwPnHUKawA9eddYeXDF</code></p>
        <button id="callBtn" style="width: 100%;">执行 doSomething 方法</button>
        <p id="status" style="margin-top: 10px; color: #666; font-style: italic;">状态：等待手机钱包连接...</p>
    </div>

    <script>
        const CONTRACT_ADDRESS = "TPEbXV8AEFVoysQiwPnHUKawA9eddYeXDF";
        
        // 1. 自动获取当前的 GitHub Pages 线上网址（如果是本地打开也会自动适配）
        const currentUrl = window.location.href;
        document.getElementById('urlText').innerText = currentUrl;

        // 2. 自动生成二维码图片
        const qrImg = document.getElementById('qrcode');
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=` + encodeURIComponent(currentUrl);

        const callBtn = document.getElementById('callBtn');
        const statusSpan = document.getElementById('status');

        // 页面加载后自动尝试检测手机端 TronLink 环境
        window.addEventListener('load', async () => {
            setTimeout(async () => {
                if (window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58) {
                    statusSpan.innerText = "钱包已连接：" + window.tronWeb.defaultAddress.base58;
                } else {
                    statusSpan.innerText = "请确保在 TronLink App 内打开，或点击上方扫码";
                }
            }, 1000);
        });

        // 点击调用合约
        callBtn.onclick = async () => {
            try {
                if (!window.tronWeb || !window.tronWeb.defaultAddress.base58) {
                    alert("请先在手机 TronLink 钱包中授权连接此网页！");
                    return;
                }
                statusSpan.innerText = "正在发送交易，请在钱包中签名...";
                
                const contract = await window.tronWeb.contract().at(CONTRACT_ADDRESS);
                const tx = await contract.doSomething().send();
                
                statusSpan.innerText = "调用成功！交易哈希: " + tx;
                console.log("TxID:", tx);
            } catch (error) {
                console.error(error);
                statusSpan.innerText = "调用失败: " + (error.message || error);
            }
        };
    </script>
</body>
</html>
