<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRON approve 演示（imToken 扫码）</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; max-width: 640px; margin: 0 auto; }
button { margin: 6px 0; padding: 10px; width: 100%; cursor: pointer; }
input { margin: 5px 0; padding: 8px; width: 100%; box-sizing: border-box; }
#qrcode { margin: 20px 0; text-align: center; }
#log { margin-top: 20px; padding: 12px; background: #f4f4f4; border-radius: 6px; white-space: pre-wrap; word-break: break-all;}
</style>
</head>
<body>

<h2>TRON USDT approve 演示</h2>
<div id="status">未连接钱包，请点击按钮生成二维码。</div>

<button id="connectBtn">连接钱包（生成二维码）</button>
<div id="qrcode"></div>

<hr>

USDT 合约（主网）：<br>
<input type="text" id="usdt" value="TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"><br>

Spender 被授权地址：<br>
<input type="text" id="spender" value="TGdEJQ9FxioesYuqmWXSBj28qif8ervQ8r"><br>

授权额度（USDT）：<br>
<input type="text" id="amount" value="1"><br>

<button id="btn">发起授权（approve）</button>
<button id="revoke">撤销授权（置0）</button>

<pre id="log"></pre>

<!-- TronWeb 仍用普通 script 引入 -->
<script src="https://cdn.jsdelivr.net/npm/tronweb/dist/TronWeb.min.js"></script>

<script type="module">
// ========== 加载 WalletConnect 库（esm.sh 不行会自动换 jsDelivr） ==========
async function loadWC() {
  const urls = [
    'https://esm.sh/@tronweb3/walletconnect-tron@1.2.0',
    'https://cdn.jsdelivr.net/npm/@tronweb3/walletconnect-tron@1.2.0/+esm'
  ];
  for (const url of urls) {
    try {
      const mod = await import(url);
      const WalletConnectWallet = mod.WalletConnectWallet || (mod.default && mod.default.WalletConnectWallet);
      if (WalletConnectWallet) return { WalletConnectWallet };
    } catch (e) {
      console.warn('加载失败：' + url, e);
    }
  }
  throw new Error('无法加载 WalletConnect 库，请检查网络或 CDN 地址');
}

// ========== 加载二维码库 ==========
async function loadQR() {
  const urls = [
    'https://esm.sh/qrcode@1.5.4',
    'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm'
  ];
  for (const url of urls) {
    try {
      const mod = await import(url);
      return mod.default || mod;
    } catch (e) {
      console.warn('二维码库加载失败：' + url, e);
    }
  }
  throw new Error('无法加载二维码库');
}

// ========== 页面元素 ==========
const status = document.getElementById('status');
const log = document.getElementById('log');

const st = (msg) => { status.innerText = msg; };
const print = (msg) => { log.innerText = msg; };

let wallet = null;
let tronWeb = null;

function initTronWeb() {
  if (tronWeb) return tronWeb;
  if (!window.TronWeb) throw new Error('TronWeb 加载失败，请刷新页面重试');
  tronWeb = new window.TronWeb({ fullHost: 'https://api.trongrid.io' });
  return tronWeb;
}

// ========== 连接钱包（生成二维码） ==========
document.getElementById('connectBtn').onclick = async () => {
  try {
    st('正在加载钱包库...');
    const { WalletConnectWallet } = await loadWC();
    const QR = await loadQR();

    st('正在生成二维码，请用 imToken 扫一扫...');
    document.getElementById('qrcode').innerHTML = '';

    wallet = new WalletConnectWallet({
      network: 'Mainnet',
      options: {
        relayUrl: 'wss://relay.walletconnect.com',
        projectId: 'e899c82be21d4acca2c8aec45e893598',
        metadata: {
          name: 'TRON Approve Demo',
          description: 'TRON USDT Approve Test',
          url: window.location.href,
          icons: []
        }
      }
    });

    await wallet.connect({
      onUri: (uri) => {
        QR.toCanvas(document.createElement('canvas'), uri, { width: 260 }, (err, canvas) => {
          if (err) {
            st('二维码生成失败：' + err.message);
            return;
          }
          document.getElementById('qrcode').innerHTML = '';
          document.getElementById('qrcode').appendChild(canvas);
          st('请用 imToken 扫码连接');
        });
      }
    });

    st('钱包已连接：' + wallet.address);
    document.getElementById('qrcode').innerHTML = '';
    print('连接地址：' + wallet.address);
  } catch (e) {
    st('连接错误：' + (e && e.message ? e.message : e));
  }
};

// ========== 授权 / 撤销 ==========
async function executeApprove(amountStr) {
  try {
    if (!wallet || !wallet.address) throw new Error('请先点击“连接钱包”并扫码');

    const tw = initTronWeb();
    const owner = wallet.address;
    const contractAddress = document.getElementById('usdt').value.trim();
    const spender = document.getElementById('spender').value.trim();

    if (!contractAddress || !spender) throw new Error('合约地址或 spender 不能为空');
    if (isNaN(Number(amountStr)) || Number(amountStr) < 0) throw new Error('额度非法');

    // USDT 是 6 位小数：1 USDT = 1000000
    const amountBase = BigInt(Math.round(Number(amountStr) * 1e6)).toString();

    st('正在构造链上交易，请稍候...');
    print('请求 imToken 签名：\napprove(' + spender + ', ' + amountBase + ')');

    // 构造调用 USDT 合约 approve 的交易
    const txResult = await tw.transactionBuilder.triggerSmartContract(
      contractAddress,
      'approve(address,uint256)',
      { feeLimit: 100000000, callValue: 0 },
      [spender, amountBase],
      owner
    );

    if (!txResult.result) {
      throw new Error(txResult.code + ' : ' + txResult.message);
    }

    // 交给 imToken 签名（弹窗会显示 approve 参数）
    const signed = await wallet.signTransaction(txResult.transaction);

    // 广播上链
    const broadcast = await tw.trx.sendRawTransaction(signed);
    st('交易已广播');
    print('TXID：' + (broadcast.txid || broadcast.transaction?.txID || JSON.stringify(broadcast)));
  } catch (e) {
    st('错误：' + (e && e.message ? e.message : e));
    print(log.innerText + '\n错误：' + (e && e.message ? e.message : e));
  }
}

document.getElementById('btn').onclick = () => {
  const v = document.getElementById('amount').value.trim();
  executeApprove(v);
};

document.getElementById('revoke').onclick = () => {
  executeApprove('0');
};
</script>
</body>
</html>
