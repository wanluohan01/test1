<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>本地离线二维码生成</title>
<style>
  body { font-family: Arial; max-width: 400px; margin: 20px auto; text-align: center; }
  #qr { margin-top: 20px; }
</style>
<!-- 引用同目录下的本地 JS 文件，完全不走运行时 CDN -->
<script src="./qrcode.min.js"></script>
</head>
<body>
  <h3>自动生成二维码</h3>
  <div id="status">页面加载中，自动生成二维码...</div>
  <div id="qr"></div>

<script>
// 页面打开自动执行
window.onload = function() {
  try {
    // 生成测试二维码（这里用当前网页地址作为内容）
    var qrContent = window.location.href; 
    
    // 使用本地的 qrcodejs 库生成二维码
    new QRCode(document.getElementById("qr"), {
      text: qrContent,
      width: 260,
      height: 260,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });
    
    document.getElementById("status").innerText = "请用钱包扫码";
  } catch (e) {
    document.getElementById("status").innerText = "错误：" + (e.message || e);
  }
};
</script>
</body>
</html>
