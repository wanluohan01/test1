<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRON 智能合约代理转账与余额查询</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f6f9;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #333; text-align: center; }
        .box {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .success-btn { background-color: #28a745 !important; }
        .success-btn:hover { background-color: #218838 !important; }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .highlight { color: #007bff; font-weight: bold; word-break: break-all; }
        .status { color: #555; font-style: italic; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>

    <h2>TRON 合约代理转账 DApp</h2>

    <!-- 第一步：账户信息与余额展示 -->
    <div class="box">
        <h3>1. 钱包账户信息</h3>
        <p>当前钱包地址：<br><span id="account" class="highlight">正在请求授权...</span></p>
        <p>TRX 余额：<span id="trxBalance" class="highlight">0.00 TRX</span></p>
        <p>USDT (TRC-20) 余额：<span id="usdtBalance" class="highlight">0.00 USDT</span></p>
        <button id="reconnectBtn" style="background-color: #6c757d;">重新连接 / 刷新余额</button>
    </div>

    <!-- 第二步：合约代理转账 -->
    <div class="box">
        <h3>2. 合约代理转账</h3>
        <label>选择币种：</label>
        <select id="coinType">
            <option value="TRX">TRX (原生币)</option>
            <option value="USDT">USDT (TRC-20 测试代币)</option>
        </select>

        <label>接收方地址：</label>
        <input type="text" id="toAddress" placeholder="输入接收方波场地址 (以 T 开头)">
        
        <label>转账数量：</label>
        <input type="number" id="amount" placeholder="例如: 10" value="1">
        
        <button id="proxyTransferBtn" class="success-btn">通过合约代理转账</button>
        <p id="transferStatus" class="status">状态：等待操作</p>
    </div>

    <script>
        // 【重要】请将这里替换为你刚刚通过 tronbox migrate 部署成功后拿到的合约地址！
        const PROXY_CONTRACT_ADDRESS = "请替换为你的ProxyTransfer合约地址";
        
        // Nile 测试网官方示例 USDT 合约地址
        const USDT_CONTRACT_ADDRESS = "TXLAQ63Xg1NAzckPwKHvzw7CSEmLMEqcdj"; 

        const accountSpan = document.getElementById('account');
        const trxBalanceSpan = document.getElementById('trxBalance');
        const usdtBalanceSpan = document.getElementById('usdtBalance');
        const transferStatus = document.getElementById('transferStatus');

        // 页面加载完成后自动触发授权和数据加载
        window.addEventListener('load', async () => {
            setTimeout(initDApp, 1000);
        });

        document.getElementById('reconnectBtn').onclick = initDApp;

        async function initDApp() {
            try {
                transferStatus.innerText = "正在请求 TronLink 授权...";
                
                // 1. 自动请求 TronLink 授权弹窗
                if (window.tronLink) {
                    await window.tronLink.request({ method: 'tron_requestAccounts' });
                }

                // 2. 检查 tronWeb 及默认地址是否就绪
                if (window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58) {
                    const address = window.tronWeb.defaultAddress.base58;
                    accountSpan.innerText = address;
                    transferStatus.innerText = "钱包连接成功，数据已刷新";

                    // 3. 查询 TRX 余额
                    const trxSun = await window.tronWeb.trx.getBalance(address);
                    trxBalanceSpan.innerText = window.tronWeb.fromSun(trxSun) + " TRX";

                    // 4. 查询 TRC-20 (USDT) 余额
                    try {
                        const usdtContract = await window.tronWeb.contract().at(USDT_CONTRACT_ADDRESS);
                        const usdtBal = await usdtContract.balanceOf(address).call();
                        // Nile 测试网 USDT 通常为 6 位小数
                        usdtBalanceSpan.innerText = (usdtBal / 1000000).toFixed(2) + " USDT";
                    } catch (e) {
                        usdtBalanceSpan.innerText = "读取 USDT 失败";
                    }
                } else {
                    accountSpan.innerText = "未授权或未检测到钱包";
                    transferStatus.innerText = "请确保在 TronLink 内置浏览器中打开并解锁";
                }
            } catch (err) {
                console.error(err);
                transferStatus.innerText = "初始化失败: " + (err.message || err);
            }
        }

        // 点击代理转账按钮
        document.getElementById('proxyTransferBtn').onclick = async () => {
            const coinType = document.getElementById('coinType').value;
            const toAddress = document.getElementById('toAddress').value.trim();
            const amountStr = document.getElementById('amount').value.trim();

            if (!toAddress) {
                alert("请输入接收方地址！");
                return;
            }
            if (!amountStr || Number(amountStr) <= 0) {
                alert("请输入正确的转账数量！");
                return;
            }

            try {
                const proxyContract = await window.tronWeb.contract().at(PROXY_CONTRACT_ADDRESS);

                if (coinType === "TRX") {
                    transferStatus.innerText = "正在通过合约代理转账 TRX，请在钱包中签名...";
                    const amountInSun = window.tronWeb.toSun(Number(amountStr));
                    
                    // 调用合约的 proxySendTRX 方法，并通过 callValue 传入 msg.value
                    const tx = await proxyContract.proxySendTRX(toAddress).send({
                        callValue: amountInSun
                    });
                    transferStatus.innerText = "TRX 代理转账成功！交易哈希: " + tx;

                } else if (coinType === "USDT") {
                    transferStatus.innerText = "【步骤 1/2】正在请求授权 (Approve) 给合约...";
                    const usdtContract = await window.tronWeb.contract().at(USDT_CONTRACT_ADDRESS);
                    const amountInUnits = BigInt(Math.floor(Number(amountStr) * 1000000));

                    // 先让用户在钱包中确认授权 (Approve)
                    await usdtContract.approve(PROXY_CONTRACT_ADDRESS, amountInUnits.toString()).send();
                    
                    transferStatus.innerText = "【步骤 2/2】授权成功，正在通过合约代理转账 USDT...";
                    
                    // 调用合约内部的 proxySendTRC20 执行 transferFrom 代理转账
                    const tx = await proxyContract.proxySendTRC20(
                        USDT_CONTRACT_ADDRESS, 
                        toAddress, 
                        amountInUnits.toString()
                    ).send();

                    transferStatus.innerText = "USDT 代理转账成功！交易哈希: " + tx;
                }

                // 交易成功后，延迟 3 秒自动刷新余额
                setTimeout(initDApp, 3000);

            } catch (error) {
                console.error(error);
                transferStatus.innerText = "操作失败: " + (error.message || JSON.stringify(error));
            }
        };
    </script>
</body>
</html>
