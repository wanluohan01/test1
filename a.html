<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nile USDT 授权+代转</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5/dist/TronWeb.min.js"></script>
<style>
body{font:14px/1.6 system-ui;max-width:640px;margin:20px auto;padding:0 12px}
input{width:100%;box-sizing:border-box;margin:4px 0 10px;padding:8px}
button{width:100%;padding:10px;margin:6px 0}
pre{background:#f5f5f5;padding:10px;overflow:auto;white-space:pre-wrap}
.ok{color:green}.err{color:red}
</style>
</head>
<body>
<h3>连接（手机TronLink切Nile后打开本页）</h3>
<button id="connect">连接钱包</button>
<div>当前地址：<span id="cur">-</span></div>
<div>当前节点：<span id="node">-</span></div>

<h3>参数</h3>
<label>USDT合约(Nile)</label>
<input id="usdt" value="TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf" />
<label>Owner（被代转，TTQ16）</label>
<input id="owner" value="TTQ16UHkWiHPoMVMuGK8n6NeUwRwWMVGuV" />
<label>Spender（被授权，TG9XX）</label>
<input id="spender" value="TG9XX5MXesQyG3V7Z9ZuorqvhU2KWuphkY" />
<label>收款人（TABPox）</label>
<input id="to" value="TABPoxCoSNXgWtC6H9gYLpeztiBgAsCkX6" />
<label>金额（USDT整数，如10）</label>
<input id="amt" value="10001" />

<h3>操作</h3>
<button id="balance">查Owner余额 / Spender已授权额度</button>
<button id="approve">A. 当前钱包授权Spender（用TTQ16点）</button>
<button id="transferFrom">B. 当前钱包代转TransferFrom（用TG9XX点）</button>

<pre id="log"></pre>

<script>
const $ = id => document.getElementById(id);
const log = (m,cls='') => $('log').textContent += '\n' + (cls?('['+cls+'] '):'') + m;

function tw(){
  if(window.tronWeb && window.tronWeb.ready) return window.tronWeb;
  if(window.tron && window.tron.tronWeb && window.tron.tronWeb.ready) return window.tron.tronWeb;
  return null;
}
function fallbackTronWeb(){
  return new TronWeb({ fullHost:'https://api.nileex.io' });
}
async function requireNile(){
  let t = tw();
  if(t){
    const host = (t.fullnode && t.fullnode.host) || '';
    if(host && !/nile/i.test(host)) throw new Error('手机钱包请切到Nile测试网后再打开本页；当前节点='+host);
    return t;
  }
  // 未注入则仅做只读兜底（发交易必须钱包注入）
  return fallbackTronWeb();
}
async function decimalsOf(c){
  try { return Number(await c.decimals().call()); } catch(e){ return 6; }
}

$('connect').onclick = async () => {
  try{
    let t = tw();
    if(!t){ t = fallbackTronWeb(); }
    let addr = (t.defaultAddress && t.defaultAddress.base58) || '-';
    let host = (t.fullnode && t.fullnode.host) || (t.fullNode&&t.fullNode.host) || 'fallback/api.nileex.io';
    $('cur').textContent = addr;
    $('node').textContent = host;
    log('连接：'+addr+' / '+host, 'ok');
  }catch(e){ log('连接失败：'+e.message,'err'); }
};

$('balance').onclick = async () => {
  try{
    const t = await requireNile();
    const c = await t.contract().at($('usdt').value.trim());
    const dec = await decimalsOf(c);
    const bal = await c.balanceOf($('owner').value.trim()).call();
    const allow = await c.allowance($('owner').value.trim(), $('spender').value.trim()).call();
    log('Owner余额='+(Number(bal)/10**dec)+' USDT', 'ok');
    log('Spender已授权='+(Number(allow)/10**dec)+' USDT', 'ok');
  }catch(e){ log('查询失败：'+e.message,'err'); }
};

$('approve').onclick = async () => {
  try{
    const t = await requireNile();
    const cur = t.defaultAddress.base58;
    if(cur !== $('owner').value.trim()) log('提示：当前钱包='+cur+'，不是Owner(TTQ16)，请切到TTQ16再点','err');
    const c = await t.contract().at($('usdt').value.trim());
    const dec = await decimalsOf(c);
    const raw = BigInt(Math.floor(parseFloat($('amt').value)*10**dec));
    const tx = await c.approve($('spender').value.trim(), raw).send({ feeLimit:100_000_000 });
    log('approve已提交 txID='+tx, 'ok');
    log('浏览器：https://nile.tronscan.org/#/transaction/'+tx);
  }catch(e){ log('approve失败：'+e.message,'err'); }
};

$('transferFrom').onclick = async () => {
  try{
    const t = await requireNile();
    const cur = t.defaultAddress.base58;
    if(cur !== $('spender').value.trim()) log('提示：当前钱包='+cur+'，不是Spender(TG9XX)，请切到TG9XX再点','err');
    const c = await t.contract().at($('usdt').value.trim());
    const dec = await decimalsOf(c);
    const raw = BigInt(Math.floor(parseFloat($('amt').value)*10**dec));
    const tx = await c.transferFrom($('owner').value.trim(), $('to').value.trim(), raw).send({ feeLimit:100_000_000 });
    log('transferFrom已提交 txID='+tx, 'ok');
   log('浏览器：https://nile.tronscan.org/#/transaction/'+tx);
  }catch(e){ log('transferFrom失败：'+e.message,'err'); }
};
</script>
</body>
</html>
