<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRXB 授权 TRXA</title>
<style>
body{font-family:system-ui;max-width:480px;margin:30px auto;padding:0 16px}
input{width:100%;padding:8px;margin:6px 0;box-sizing:border-box}
button{padding:10px 16px;margin-top:10px}
.hint{color:#888;font-size:13px}
</style>
</head>
<body>

<h3>TRXB 授权给 TRXA（Nile 测试网）</h3>

<button onclick="connect()">① 连接 TronLink</button>
<p class="hint" id="acc">未连接</p>

<label>USDT 合约地址（Nile）</label>
<input id="usdt" value="TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf">

<label>TRXA 地址（被授权方）</label>
<input id="spender" value="TG9XX5MXesQyG3V7Z9ZuorqvhU2KWuphkY">

<button onclick="loadInfo()">② 读取 TRXB 余额</button>
<p id="bal" class="hint"></p>

<label>授权额度（留空=全部余额）</label>
<input id="amount" placeholder="例如 10">

<button onclick="approve()">③ 授权</button>
<pre id="log" class="hint"></pre>

<script>
const log = m => document.getElementById('log').innerText += m + "\n";

function tw(){
  if(!window.tron || !window.tron.tronWeb) throw "没检测到 TronLink";
  return window.tron.tronWeb;
}

async function connect(){
  try{
    await window.tron.request({method:'tron_requestAccounts'});
    const t = tw();
    document.getElementById('acc').innerText = "已连接：" + t.defaultAddress.base58;
  }catch(e){ log("连接失败：" + e); }
}

async function loadInfo(){
  try{
    const t = tw();
    const usdt = await t.contract().at(document.getElementById('usdt').value.trim());
    const me = t.defaultAddress.base58;
    const raw = await usdt.balanceOf(me).call();
    const dec = await usdt.decimals().call();
    const bal = Number(raw) / 10**Number(dec);
    document.getElementById('bal').innerText =
      `TRXB 余额：${bal} USDT（raw=${raw}）`;
    window._rawBal = raw;
  }catch(e){ log("读取失败：" + e); }
}

async function approve(){
  try{
    const t = tw();
    const usdtAddr = document.getElementById('usdt').value.trim();
    const spender = document.getElementById('spender').value.trim();
    const usdt = await t.contract().at(usdtAddr);

    let amount = document.getElementById('amount').value.trim();
    if(!amount){
      amount = window._rawBal;
    }else{
      const dec = await usdt.decimals().call();
      amount = Math.floor(Number(amount) * 10**Number(dec));
    }

    log("发起 approve...");
    const tx = await usdt.approve(spender, amount).send({
      feeLimit: 20_000_000,
      shouldPollResponse: true
    });
    log("授权成功 txID: " + tx);
    log("去 Nile Tronscan 查 allowance 即可");
  }catch(e){ log("授权失败：" + (e && e.message || e)); }
}
</script>
</body>
</html>
