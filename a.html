<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TRON USDT Approve (imToken 扫码)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; }
  h3 { margin-bottom: 10px; }
  #status { padding: 8px; background: #e6f7ff; border-radius: 4px; margin-bottom: 10px; }
  #dep { background: #fffbe6; padding: 8px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; margin-bottom: 15px; }
  #qr { text-align: center; margin: 15px 0; }
  label { display: block; margin-top: 10px; color: #555; }
  input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
  .blue { background: #1677ff; }
  .red { background: #ff4d4f; }
  .gray { background: #888; }
  #log { background: #f5f5f5; padding: 10px; margin-top: 15px; min-height: 40px; white-space: pre-wrap; word-break: break-all; }
</style>
<!-- 本地依赖 -->
<script src="./TronWeb.min.js"></script>
<script src="./qrcode.min.js"></script>
</head>
<body>
<h3>TRON USDT Approve (imToken 扫码)</h3>
<div id="status">初始化...</div>
<div id="dep"></div>
<div id="qr"></div>

<label>USDT 合约：</label>
<input id="usdt" value="TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj">

<label>Spender：</label>
<input id="spender" value="TGdEJQ9FxioesYuqmWXSBj28qif8ervQ8r">

<label>额度(USDT)：</label>
<input id="amount" value="1">

<button class="blue" id="approve">发起授权 approve</button>
<button class="red" id="revoke">撤销授权（置 0）</button>
<button class="gray" id="disconnect">断开连接</button>
<pre id="log"></pre>

<script type="module">
// 在线导入 WalletConnect (v4)
import * as WC from 'https://esm.sh/@tronweb3/walletconnect-tron@4.0.3?bundle=all';
// 若 esm.sh 被拦，请改用下方 jsDelivr 备选：
// import * as WC from 'https://gcore.jsdelivr.net/npm/@tronweb3/walletconnect-tron@4.0.3/+esm';

// ✅ 修复：安全获取 DOM 元素并设置文本
const statusEl = document.getElementById('status');
const depEl = document.getElementById('dep');
const qrEl = document.getElementById('qr');
const logEl = document.getElementById('log');

const st = (m) => { if(statusEl) statusEl.innerText = m; };
const log = (m) => { if(logEl) logEl.innerText = m; };

// 依赖自检
const WcClass = WC.WalletConnectWallet;
depEl.innerText = 
  'TronWeb=' + (typeof TronWeb) + 
  '\nQRCode=' + (typeof QRCode) + 
  '\nWalletConnectWallet=' + (typeof WcClass) + 
  '\nwc 导出 keys: ' + Object.keys(WC).join(', ');

let wallet = null;
const tw = new TronWeb({ fullHost: 'https://api.trongrid.io' });

function draw(u) {
  qrEl.innerHTML = '';
  new QRCode(qrEl, { text: u, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.H });
}

async function start() {
  try {
    if (typeof WcClass !== 'function') throw new Error('WalletConnectWallet 导出失败，请检查网络');
    
    // 初始化 WalletConnect
    wallet = new WcClass({
      network: 'Mainnet',
      options: {
        relayUrl: 'wss://relay.walletconnect.com',
        projectId: '79fdcd030fe9e6e174073d69f9c9d04a', // 真实 ID
        metadata: { 
          name: 'TRON Approve Demo', 
          description: 'demo', 
          url: 'https://wanluohan01.github.io/test1', // 匹配白名单
          icons: [] 
        }
      }
    });
    
    st('等待钱包连接…（弹窗中）');
    
    // v4 走 AppKit 模态框，不传 onUri
    const res = await wallet.connect(); 
    
    const addr = (res && res.address) || wallet.address || '';
    if (!addr) throw new Error('未获取到地址，可能关闭了模态框');
    
    st('已连接: ' + addr);
    log('地址: ' + addr);
    qrEl.innerHTML = '';
  } catch (e) {
    st('连接错误: ' + (e && e.message ? e.message : e));
    log('错误详情: ' + (e && e.stack ? e.stack : e));
  }
}

// 绑定启动
window.onload = start;

async function doApprove(v) {
  try {
    if (!wallet) throw new Error('请先扫码连接');
    const addr = wallet.address;
    const usdt = document.getElementById('usdt').value.trim();
    const sp = document.getElementById('spender').value.trim();
    
    if (isNaN(Number(v)) || Number(v) < 0) throw new Error('额度非法');
    
    const base = BigInt(Math.round(Number(v) * 1e6)).toString();
    st('正在构造 approve…');
    
    const { transaction } = await tw.transactionBuilder.triggerSmartContract(
      usdt, 'approve(address,uint256)',
      { feeLimit: 100000000, callValue: 0 },
      [{ type: 'address', value: sp }, { type: 'uint256', value: base }],
      addr
    );
    
    log('请求 imToken 签名:\napprove(' + sp + ', ' + base + ')');
    const signed = await wallet.signTransaction(transaction);
    const r = await tw.trx.sendRawTransaction(signed);
    
    st('已广播');
    log('TXID: ' + (r && r.txid ? r.txid : JSON.stringify(r)));
  } catch (e) {
    st('错误: ' + (e && e.message ? e.message : e));
    log('错误详情: ' + (e && e.stack ? e.stack : e));
  }
}

document.getElementById('approve').onclick = () => doApprove(document.getElementById('amount').value.trim());
document.getElementById('revoke').onclick = () => doApprove('0');
document.getElementById('disconnect').onclick = async () => {
  try { if (wallet && wallet.disconnect) await wallet.disconnect(); } catch (e) {}
  st('已断开');
  qrEl.innerHTML = '';
};
</script>
</body>
</html>
