<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nile USDT Approve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    }
    h2 {
      margin-bottom: 4px;
      font-size: 22px;
    }
    .network {
      color: #27ae60;
      font-size: 13px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin: 16px 0 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
    }
    input[readonly] {
      background: #f8fafc;
      color: #475569;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      background: #2563eb;
      color: #fff;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }
    #log {
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }
    .line { margin: 2px 0; }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
    .warn { color: #d97706; }
    .btn-group { display: flex; gap: 10px; margin-top: 12px; }
    .btn-group button { margin-top: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>TRC20 USDT 授权</h2>
    <p class="network">🌐 Nile Testnet</p>

    <label>USDT 合约（固定）</label>
    <input readonly value="TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf" />

    <label>trxB（当前钱包 / 授权人）</label>
    <input id="trxB" readonly placeholder="连接后自动获取" />

    <label>trxA（被授权地址 / spender）</label>
    <input id="trxA" placeholder="T..." />

    <label>授权数量（USDT）</label>
    <input id="amount" type="number" min="0" step="0.000001" placeholder="如 100" />

    <div class="btn-group">
      <button id="connectBtn">连接钱包</button>
      <button id="approveBtn" disabled>确认授权</button>
    </div>

    <div id="log"></div>
  </div>

  <script>
    // ========== 配置 ==========
    const USDT_CONTRACT = 'TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf'; // Nile 测试网 USDT

    // ========== 状态 ==========
    let provider = null;
    let tronWeb = null;
    let currentAddress = null;

    const logEl = document.getElementById('log');
    const connectBtn = document.getElementById('connectBtn');
    const approveBtn = document.getElementById('approveBtn');

    // ---------- 日志 ----------
    function log(msg, type = '') {
      const div = document.createElement('div');
      div.className = `line ${type}`;
      div.textContent = msg;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ---------- 检测钱包注入 ----------
    function findProvider() {
      // 优先 window.tron（手机钱包 / 内置浏览器常用）
      if (window.tron && window.tron.tronWeb) return window.tron;
      // 其次 window.tronLink（桌面插件常用）
      if (window.tronLink && window.tronLink.tronWeb) return window.tronLink;
      return null;
    }

    // ---------- 连接钱包 ----------
    async function connect() {
      try {
        provider = findProvider();

        if (!provider) {
          alert('未检测到 TRON 钱包，请使用 TronLink 浏览器插件或手机钱包浏览器');
          log('未检测到钱包注入', 'err');
          return;
        }

        // 如果钱包已经解锁，直接拿地址
        const tw = provider.tronWeb;
        if (tw && tw.ready) {
          tronWeb = tw;
          currentAddress = tw.defaultAddress?.base58 || '';
        }

        // 如果还没拿到，尝试通过 EIP-1193 请求授权
        if (!currentAddress && provider.request) {
          try {
            const accounts = await provider.request({ method: 'eth_requestAccounts' });
            if (accounts && accounts.length > 0) {
              currentAddress = accounts[0];
              // 重新赋值 tronWeb（某些情况下这里才有 ready）
              tronWeb = provider.tronWeb || provider.tron;
            }
          } catch (e) {
            log('授权请求被取消或失败', 'warn');
          }
        }

        // 最后兜底：直接从 tronWeb.defaultAddress 再试一次
        if (!currentAddress && tronWeb) {
          currentAddress = tronWeb.defaultAddress?.base58 || '';
        }

        if (!currentAddress) {
          log('无法获取地址，请确保钱包已解锁', 'err');
          return;
        }

        // 显示 trxB
        document.getElementById('trxB').value = currentAddress;
        log(`✅ 已连接钱包：${currentAddress}`, 'ok');

        // 网络检查（仅提示）
        const node = (tronWeb && (tronWeb.fullnode?.host || tronWeb.fullNode?.host)) || '';
        log(`当前连接节点：${node || '未知'}`);
        if (node && !/nile/i.test(node)) {
          log('⚠️ 当前节点不是 Nile，请在钱包中切换到 Nile Testnet', 'warn');
        }

        approveBtn.disabled = false;
      } catch (e) {
        log('连接失败：' + (e?.message || e), 'err');
      }
    }

    // ---------- 执行 Approve ----------
    async function approve() {
      try {
        // 读输入
        const trxA = document.getElementById('trxA').value.trim();
        const amount = document.getElementById('amount').value;

        // 校验
        if (!tronWeb || !currentAddress) {
          log('请先连接钱包', 'err');
          return;
        }
        if (!tronWeb.isAddress(trxA)) {
          log('❌ trxA 地址格式不合法', 'err');
          return;
        }
        if (!(parseFloat(amount) > 0)) {
          log('❌ 授权数量必须大于 0', 'err');
          return;
        }

        // 创建合约实例（USDT 合约固定）
        log('正在读取合约 decimals...');
        const contract = await tronWeb.contract().at(USDT_CONTRACT);
        const decimalsResult = await contract.decimals().call();
        const decimals = Number(decimalsResult) || 6;
        log(`decimals = ${decimals}`);

        // 计算最小单位金额
        const rawAmount = BigInt(Math.round(parseFloat(amount) * Math.pow(10, decimals)));
        log(`授权金额（最小单位）：${rawAmount.toString()}`);

        // 发起 approve
        log('请在钱包中确认这笔授权...');
        const tx = await contract.approve(trxA, rawAmount.toString()).send({
          feeLimit: 100_000_000,      // 能量上限 100 TRX，测试网够用
          callValue: 0,
          shouldPollResponse: true    // 等待上链返回
        });

        log(`✅ Approve 成功！TxID: ${tx}`, 'ok');
        log(`🔍 浏览器查看：https://nile.tronscan.org/#/transaction/${tx}`, 'ok');
      } catch (e) {
        // 用户取消或合约错误
        log('❌ 授权失败：' + (e?.message || e), 'err');
      }
    }

    // ---------- 监听账户切换 ----------
    function watchAccountChange() {
      try {
        if (window.tron && window.tron.tronWeb) {
          window.tron.tronWeb.on?.('accountsChanged', (addr) => {
            if (addr) {
              currentAddress = addr;
              document.getElementById('trxB').value = addr;
              log('账户已切换：' + addr, 'warn');
            }
          });
        }
      } catch (e) {
        // 忽略监听失败
      }
    }

    // ---------- 初始化 ----------
    window.addEventListener('load', () => {
      // 如果钱包已注入且已解锁，直接连接
      const provider = findProvider();
      if (provider && provider.tronWeb && provider.tronWeb.ready) {
        connect();
      }
      watchAccountChange();
    });

    connectBtn.addEventListener('click', connect);
    approveBtn.addEventListener('click', approve);
  </script>
</body>
</html>
