<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nile USDT Approve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    }
    h2 {
      margin-bottom: 4px;
      font-size: 22px;
    }
    .network {
      color: #27ae60;
      font-size: 13px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin: 16px 0 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
    }
    input[readonly] {
      background: #f8fafc;
      color: #475569;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      background: #2563eb;
      color: #fff;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }
    #log {
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }
    .line { margin: 2px 0; }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
    .warn { color: #d97706; }
    .btn-group { display: flex; gap: 10px; margin-top: 12px; }
    .btn-group button { margin-top: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>TRC20 USDT 授权</h2>
    <p class="network">🌐 Nile Testnet</p>

    <label>USDT 合约（固定）</label>
    <input readonly value="TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf" />

    <label>trxB（当前钱包 / 授权人）</label>
    <input id="trxB" readonly placeholder="连接后自动获取" />

    <label>trxA（被授权地址 / spender）</label>
    <input id="trxA" placeholder="T..." />

    <label>授权数量（USDT）</label>
    <input id="amount" type="number" min="0" step="0.000001" placeholder="如 100" />

    <div class="btn-group">
      <button id="connectBtn">连接钱包</button>
      <button id="approveBtn" disabled>确认授权</button>
    </div>

    <div id="log"></div>
  </div>

  <script>
    const USDT_NILE = 'TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf';
    let tronWeb = null;
    let currentAddress = null;
  
    // 找钱包注入对象（兼容电脑插件和手机钱包）
    function findProvider() {
      if (typeof window !== 'undefined') {
        if (window.tronLink && window.tronLink.tronWeb) return window.tronLink;
        if (window.tron && window.tron.tronWeb) return window.tron;
      }
      return null;
    }
  
    // 核心：精准换算最小单位（防浮点数精度丢失），返回字符串
    function toBaseUnits(amountStr, decimals) {
      const [intPart = '0', fracPartRaw = ''] = String(amountStr).split('.');
      const fracPart = (fracPartRaw + '0'.repeat(decimals)).slice(0, decimals);
      let combined = (intPart + fracPart).replace(/^0+(?=\d)/, '');
      return combined === '' ? '0' : combined;
    }
  
    function log(msg, type) {
      const box = document.getElementById('log');
      const div = document.createElement('div');
      div.textContent = msg;
      if (type === 'err') div.style.color = '#f53f3f';
      if (type === 'ok') div.style.color = '#00b42a';
      if (type === 'warn') div.style.color = '#ff7d00';
      box.appendChild(div);
      console.log(msg);
    }
  
    // 连接钱包
    async function connect() {
      try {
        const provider = findProvider();
        if (!provider) {
          log('❌ 未检测到钱包，请用钱包内置浏览器打开', 'err');
          return;
        }
  
        let accounts = null;
        if (provider.request) {
          accounts = await provider.request({ method: 'eth_requestAccounts' });
        }
  
        tronWeb = provider.tronWeb;
        currentAddress = accounts?.[0] || tronWeb.defaultAddress?.base58;
  
        if (!currentAddress) {
          log('❌ 获取地址失败，请在钱包中解锁', 'err');
          return;
        }
  
        document.getElementById('trxB').value = currentAddress;
        log('✅ 已连接钱包：' + currentAddress, 'ok');
  
        // 节点提示
        const node = tronWeb.fullnode?.host || '';
        if (!/nile/i.test(node)) {
          log('⚠️ 当前节点不是 Nile，请在钱包切换', 'warn');
        }
      } catch (e) {
        log('❌ 连接失败：' + (e?.message || e), 'err');
      }
    }
  
    // 安全授权（先清零再授权）
    async function safeApprove(contract, spender, rawAmountStr) {
      const owner = currentAddress;
      // 读取当前已授权额度
      const currentAllowance = (await contract.allowance(owner, spender).call()).toString();
  
      // 如果当前额度不为0且不等于新额度，先清零
      if (currentAllowance !== '0' && currentAllowance !== rawAmountStr) {
        log('🔄 检测到旧授权，先清零...');
        // 【关键】金额传字符串
        await contract.approve(spender, '0').send({
          feeLimit: '50000000', 
          callValue: '0'
        });
        log('✅ 清零成功');
      }
  
      // 执行新授权
      return contract.approve(spender, rawAmountStr).send({
        feeLimit: '50000000', 
        callValue: '0'
      });
    }
  
    // 确认授权
    async function approve() {
      try {
        if (!tronWeb || !currentAddress) {
          log('❌ 请先连接钱包', 'err');
          return;
        }
  
        const trxA = document.getElementById('trxA').value.trim();
        const amount = document.getElementById('amount').value;
  
        if (!tronWeb.isAddress(trxA)) {
          log('❌ trxA 地址不合法', 'err');
          return;
        }
        if (!(parseFloat(amount) > 0)) {
          log('❌ 授权数量必须大于 0', 'err');
          return;
        }
  
        log('⏳ 正在读取合约 decimals...');
        const contract = await tronWeb.contract().at(USDT_NILE);
        const decimals = Number(await contract.decimals().call()) || 6;
        
        log(`decimals = ${decimals}`);
  
        // 换算金额并强制转字符串
        const rawAmountStr = toBaseUnits(amount, decimals);
        log(`授权金额（最小单位）：${rawAmountStr}`);
        log('📝 请在钱包中确认这笔授权...');
  
        // 调用安全授权
        const tx = await safeApprove(contract, trxA, rawAmountStr);
  
        log('✅ 授权成功！TxID: ' + tx, 'ok');
        log('🔍 浏览器查看：https://nile.tronscan.org/#/transaction/' + tx, 'ok');
  
      } catch (e) {
        // 细化手机端错误提示
        if (e?.message?.includes('Invalid transaction provided')) {
          log('❌ 授权失败：参数类型被钱包拦截（已修复，请重试）', 'err');
        } else if (e?.message?.includes('Confirmation declined')) {
          log('❌ 授权失败：用户在钱包中拒绝了签名', 'err');
        } else {
          log('❌ 授权失败：' + (e?.message || e), 'err');
        }
      }
    }
  
    // 绑定事件
    document.getElementById('connectBtn').onclick = connect;
    document.getElementById('approveBtn').onclick = approve;
  
    // 监听账户切换
    if (typeof window !== 'undefined' && window.tron?.tronWeb) {
      try {
        window.tron.tronWeb.on?.('accountsChanged', (addr) => {
          if (addr) {
            currentAddress = addr;
            document.getElementById('trxB').value = addr;
            log('🔄 账户已切换：' + addr, 'warn');
          }
        });
      } catch (_) {}
    }
  
    // 页面加载时自动尝试连接
    window.addEventListener('load', () => {
      const provider = findProvider();
      if (provider && provider.tronWeb && provider.tronWeb.ready) {
        connect();
      }
    });
</script>
</body>
</html>
