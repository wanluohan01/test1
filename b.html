<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nile USDT Approve</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 14px; padding: 10px 16px; width: 100%; }
    #log { margin-top: 14px; white-space: pre-wrap; font-size: 13px; }
    .err { color: #c0392b; }
    .ok { color: #27ae60; }
    .tip { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h2>USDT Approve · Nile Testnet</h2>
  <p class="tip">请在 TronLink / 钱包里先把网络切到「TRON Nile Testnet」</p>

  <label>trxA（USDT 合约）</label>
  <input id="token" value="TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf" />

  <label>trxB（被授权地址 = 当前钱包）</label>
  <input id="spender" placeholder="连接后自动填入" readonly />

  <label>授权数量（USDT）</label>
  <input id="amount" type="number" min="0" step="0.000001" placeholder="如 100" />

  <button id="connectBtn">连接钱包</button>
  <button id="approveBtn">发起 Approve</button>

  <div id="log"></div>

  <script>
    let provider = null;
    let tronWeb = null;
    let currentAddress = null;

    const log = (msg, cls) => {
      const box = document.getElementById('log');
      box.innerHTML += `<div class="${cls || ''}">${msg}</div>`;
    };

    // ---------- 1. 发现钱包（兼容桌面+手机钱包浏览器） ----------
    const providers = new Map();

    window.addEventListener('TIP6963:announceProvider', (e) => {
      const detail = e.detail;
      if (detail?.info?.uuid) providers.set(detail.info.uuid, detail);
    });
    window.dispatchEvent(new Event('TIP6963:requestProvider'));

    function getInjectedProvider() {
      // 优先 TIP-6963
      if (providers.size) {
        // 优先取 TronLink
        for (const p of providers.values()) {
          if (/tronlink/i.test(p.info?.name || '')) return p.provider;
        }
        return providers.values().next().value.provider;
      }
      // 兜底：老式注入
      if (window.tron && window.tron.tronWeb) return window.tron;
      if (window.tronLink && window.tronLink.tronWeb) return window.tronLink;
      return null;
    }

    // ---------- 2. 连接 ----------
    async function connect() {
      try {
        provider = getInjectedProvider();
        if (!provider) {
          alert('没检测到 TRON 钱包，请用 TronLink 浏览器/手机钱包打开');
          return;
        }

        // 请求授权（TIP-1193）
        let accounts = [];
        if (provider.request) {
          accounts = await provider.request({ method: 'eth_requestAccounts' });
        }

        tronWeb = provider.tronWeb;
        if (!tronWeb || !tronWeb.ready) {
          log('钱包未就绪，请确认已解锁并在 Nile 网络', 'err');
          return;
        }

        currentAddress = accounts?.[0]
          || tronWeb.defaultAddress?.base58
          || null;

        if (!currentAddress) {
          log('未拿到钱包地址', 'err');
          return;
        }

        document.getElementById('spender').value = currentAddress;
        log('已连接：' + currentAddress, 'ok');

        // 简单网络提醒（Nile chainId hex = 0xcd8690dc）
        const chainId = tronWeb.fullnode?.host || '';
        if (!/nile/i.test(chainId)) {
          log('⚠️ 当前节点可能不是 Nile，请在钱包切到 Nile Testnet', 'err');
        }
      } catch (e) {
        log('连接失败：' + (e?.message || e), 'err');
      }
    }

    // ---------- 3. Approve ----------
    async function approve() {
      try {
        if (!tronWeb || !currentAddress) return log('请先连接钱包', 'err');

        const token = document.getElementById('token').value.trim();
        const spender = document.getElementById('spender').value.trim();
        const amount = document.getElementById('amount').value;

        if (!tronWeb.isAddress(token)) return log('trxA 合约地址不合法', 'err');
        if (!tronWeb.isAddress(spender)) return log('trxB 地址不合法', 'err');
        if (!(Number(amount) > 0)) return log('数量必须大于 0', 'err');

        const decimals = 6;
        const raw = BigInt(Math.round(Number(amount) * 10 ** decimals));

        const contract = await tronWeb.contract().at(token);
        log('请在钱包确认 approve...');

        const tx = await contract.approve(spender, raw.toString()).send({
          feeLimit: 50_000_000,
          callValue: 0,
          shouldPollResponse: true
        });

        log('Approve 成功 ✅\nTxID: ' + tx, 'ok');
        log('浏览器：https://nile.tronscan.org/#/transaction/' + tx);
      } catch (e) {
        log('Approve 失败：' + (e?.message || e), 'err');
      }
    }

    document.getElementById('connectBtn').onclick = connect;
    document.getElementById('approveBtn').onclick = approve;

    // 账号切换时同步 trxB
    if (window.tron?.tronWeb) {
      try {
        window.tron.tronWeb.on?.('accountsChanged', (addr) => {
          currentAddress = addr;
          document.getElementById('spender').value = addr;
          log('账户已切换：' + addr);
        });
      } catch (_) {}
    }
  </script>
</body>
</html>
