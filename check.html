<!-- 本地自检页：双击打开，确认 6 个 js 都能加载、全局变量都在 -->
<!doctype html>
<html lang="zh"><head><meta charset="utf-8"/><title>依赖自检</title></head>
<body>
<h2>依赖加载自检</h2>
<pre id="out"></pre>
<script src="./buffer.min.js"></script>
<script src="./sign-client.js"></script>
<script src="./TronWeb.min.js"></script>
<script src="./qrcode.min.js"></script>
<script src="./wc.js"></script>
<script>
const o = document.getElementById('out');
const line = (k, v) => o.innerText += k + ' : ' + v + '\n';
line('Buffer', typeof window.Buffer);
line('TronWeb', typeof window.TronWeb);
line('QRCode', typeof window.QRCode);
line('@tronweb3/tronwallet-adapters', !!window['@tronweb3/tronwallet-adapters']);
line('WalletConnectAdapter', !!(window['@tronweb3/tronwallet-adapters'] && window['@tronweb3/tronwallet-adapters'].WalletConnectAdapter));
line('sign-client 全局', typeof window.SignClient || typeof window['@walletconnect/sign-client']);
</script>
</body></html>
